name: Create Theme
on:
  issues:
    types: [opened]

env:
  PYTHON_VERSION: '3.14'

jobs:
  createPR:
    permissions: write-all
    name: Submit a theme
    runs-on: windows-latest
    if: startsWith(github.event.issue.title, '[create-theme]:')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
        
      - name: Setup python modules
        run: |
          pip install requests pyyaml pillow

      - name: Find latest YASB release
        id: yasb
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo amnweb/yasb --json tagName --jq .tagName)"
          echo "tag=${tag:?No YASB release found}" >> "$GITHUB_OUTPUT"

      - name: Checkout YASB repo
        uses: actions/checkout@v6
        with:
          repository: amnweb/yasb
          ref: ${{ steps.yasb.outputs.tag }}
          path: yasb-repo

      - name: Install YASB dependencies
        run: |
          pip install ./yasb-repo

      - name: Setup Git
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create theme content
        env:
          THEME_AUTHOR: ${{ github.event.issue.user.login }}
        shell: bash
        run: |
          python .github/scripts/process-theme.py 2> error.log

      - name: Show error message
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat error.log || true
          {
            echo "# Theme Validation Error ❌"
            echo
            echo "It looks like there was a validation error with your submitted theme configuration. Please review the error message below, fix the issues in your YAML config, styles or images and submit a new request."
            echo
            echo '```text'
            printf '%s\n' "$(cat error.log 2>/dev/null)"
            echo '```'
          } > comment.md
          gh issue comment "$ISSUE_NUMBER" --body-file comment.md
          gh issue close "$ISSUE_NUMBER"

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        if: success()
        with:
          add-paths: themes/
          token: ${{ secrets.GITHUB_TOKEN  }}
          commit-message: "Add theme: ${{ env.THEME_NAME }}"
          delete-branch: true
          title: "Add theme: ${{ env.THEME_NAME }}"
          body: |
            # Add theme: ${{ env.THEME_NAME }}

            This PR adds a new theme to the theme library.

            ## Theme Details
            * **Name**: ${{ env.THEME_NAME }}
            * **Description**: ${{ env.THEME_DESCRIPTION }}
            * **Author**: @${{ env.THEME_AUTHOR }}
          base: main
          branch: create-theme-${{ github.event.issue.number }}
        
      - name: Close Issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
        run: |
          gh issue close "$ISSUE_NUMBER" --comment "# Thank you for your contribution! :tada:

          Your theme has been successfully submitted. The maintainers will review it and get back to you soon.

          Here are some details about your submission:
          * Your theme has been requested into [this PR]($PR_URL).
          * It has been created into the [create-theme-$ISSUE_NUMBER branch](https://github.com/amnweb/yasb-themes/tree/create-theme-$ISSUE_NUMBER).

          > If you have any questions or need help, feel free to ask in the comments below or in the PR."
