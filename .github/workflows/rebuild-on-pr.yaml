name: Submit PR
on:
  pull_request_target:
    types: [closed]
    paths:
      - 'themes/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.14'

concurrency:
  group: rebuild-themes
  cancel-in-progress: false

jobs:
  submitPR:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    permissions: write-all
    name: Rebuild themes after theme changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          
      - name: Install python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup python modules
        run: |
          pip install pyyaml

      - name: Rebuild all themes
        run: |
          python .github/scripts/rebuild-themes.py

      - name: Commit and push changes
        run: |
          git add themes.json
          git add themes/*
          if git diff --cached --quiet; then
            echo "themes.json is already up to date."
          else
            git commit -m "Rebuild themes.json after theme changes"
            git pull --rebase origin $(git rev-parse --abbrev-ref HEAD)
            git push
          fi

  generateReadme:
    needs: submitPR
    permissions: write-all
    name: Generate README after themes are rebuilt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          
      - name: Install python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull latest changes
        run: |
          git pull origin $(git rev-parse --abbrev-ref HEAD)

      - name: Generate README
        run: |
          python .github/scripts/generate-readme.py
        
      - name: Commit and push changes
        run: |
          git add README.md
          if git diff --cached --quiet; then
            echo "README is already up to date."
          else
            git commit -m "Update README after themes are rebuilt"
            git pull --rebase origin $(git rev-parse --abbrev-ref HEAD)
            git push
          fi

  closeFixedIssues:
    needs: generateReadme
    if: github.event_name == 'pull_request_target'
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    name: Look for fixed compatibility issues
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Start the compatibility check if a tracked theme changed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          themes="$(python .github/scripts/theme-compat.py tracked-in-pr "$PR_NUMBER")"
          if [ -n "$themes" ]; then
            echo "This merge changed themes with an open compatibility issue: $themes"
            gh workflow run theme-compatibility.yaml -f close_only=true
          else
            echo "No theme with an open compatibility issue was changed."
          fi