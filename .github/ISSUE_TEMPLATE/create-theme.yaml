name: Submit a theme
description: Submit a theme to be added to the theme library.
title: "[create-theme]: "
labels: ["new-theme"]
body:
  - type: input
    id: name
    attributes:
      label: Name
      description: The name of the theme. With a maximum of 25 characters (only letters, numbers and spacesa allowed).
      placeholder: Theme Name
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: Description
      description: A brief description of the theme. With a maximum of 200 characters.
      placeholder: Theme Description
    validations:
      required: true
  - type: upload
    id: image
    attributes:
      label: Theme screenshot
      description: >-
        One PNG screenshot of your bar, taken with the screenshot tool built into YASB:
        right-click an empty part of the bar and choose "Take Screenshot".
        The image is saved in your `Pictures\YASB_Screenshots` folder.
    validations:
      required: true
      accept: ".png"
  - type: upload
    id: files
    attributes:
      label: Theme files
      description: >-
        A ZIP file with your `config.yaml` and `styles.css`.
        Select both files, right-click and compress them to a ZIP file.
    validations:
      required: true
      accept: ".zip"
  - type: markdown
    attributes:
      value: |
        <br>

        ### README

        The README of your theme is created from the fields below. The list of widgets is added automatically from your config.
  - type: textarea
    id: about
    attributes:
      render: markdown
      label: About
      description: Write anything you want about your theme. Plain text is fine, and Markdown is supported. Add screenshots in the Preview images field below.
      placeholder: |
        A dark theme with rounded widgets and soft colors, inspired by the Catppuccin Mocha palette.

        The bar sits at the top of the screen and works on one or more monitors.
        It looks best with a dark wallpaper, like the one in the screenshots.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      render: markdown
      label: Requirements
      description: >-
        Everything your theme needs besides YASB, one per line: fonts, tools or apps. You can add a link to each one.
        Leave it empty if the theme needs nothing else.
      placeholder: |
        Segoe Fluent Icons
        [JetBrainsMono Nerd Font](https://www.nerdfonts.com/font-downloads)
        [Komorebi](https://github.com/LGUG2Z/komorebi)
  - type: upload
    id: images
    attributes:
      label: Preview images
      description: Images that show your theme in use. Large, full screen images work best. At least 1 and at most 5.
    validations:
      required: true
      accept: ".png,.jpg,.jpeg"
  - type: markdown
    attributes:
      value: "Please review the information before submitting your theme."
