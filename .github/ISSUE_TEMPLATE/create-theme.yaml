name: Submit a theme
description: Submit a theme to be added to the theme library.
title: "[create-theme]: "
labels: ["new-theme"]
body:
  - type: markdown
    attributes:
      value: >-
        **Size limit:** GitHub accepts at most 65,536 characters per submission, so the styles, config and readme
        together must stay below that. If your theme is bigger, read
        [how to submit a large theme](https://github.com/amnweb/yasb-themes/issues/382).
  - type: input
    id: name
    attributes:
      label: Name
      description: The name of the theme. With a maximum of 25 characters (only letters, numbers and spacesa allowed).
      placeholder: Theme Name
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: Description
      description: A brief description of the theme. With a maximum of 100 characters.
      placeholder: Theme Description
    validations:
      required: true
  - type: input
    id: homepage
    attributes:
      label: Homepage
      description: The URL of the theme's homepage or repository.
      placeholder: https://github.com/...
  - type: upload
    id: image
    attributes:
      label: Image
      description: >-
        One PNG screenshot of your bar, taken with the screenshot tool built into YASB:
        right-click an empty part of the bar and choose "Take Screenshot".
        The image is saved in your `Pictures\YASB_Screenshots` folder.
    validations:
      required: true
      accept: ".png"
  - type: textarea
    id: styles
    attributes:
      label: Theme Styles
      render: css
      description: The CSS styles for the theme.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Theme Config
      render: yaml
      description: The config file for the theme. Please format your yaml file correctly, remove blank lines. Here is an example of a [config file](https://github.com/amnweb/yasb-themes/blob/main/themes/56d372d9-3806-499f-9caf-03782b11413b/config.yaml)
    validations:
      required: true
  - type: textarea
    id: readme
    attributes:
      render: markdown
      label: Readme
      description: >-
        The README for your theme, in Markdown. It must include a preview image, a list of the widgets the theme uses and the fonts it needs.
        Here is an example of a [README file](https://github.com/amnweb/yasb-themes/blob/main/themes/80198c48-f70a-44a1-8507-ce300ff8e360/readme.md).
        Use images hosted on GitHub, for example in your theme's own repository. (IMPORTANT: Do not use ibb.co).
        
      placeholder: |
        # Theme name

        ![Preview](https://raw.githubusercontent.com/your-name/your-theme/main/preview.png)

        ## Widgets
        - Clock
        - Volume
        - Media

        ## Fonts
        - JetBrainsMono Nerd Font
    validations:
      required: true
  - type: markdown
    attributes:
      value: "Please review the information before submitting your theme."
